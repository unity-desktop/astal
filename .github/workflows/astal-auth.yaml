---
name: astal-auth

on:
  push:
    branches: [ubuntu/latest]
    paths: &paths
      - lib/auth/**
      - .github/workflows/astal-auth.yaml
  pull_request:
    branches: [ubuntu/latest]
    types: [opened, synchronize, reopened, closed]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: github.event.action != 'closed'
    uses: unity-desktop/workflows/.github/workflows/build-deb.yaml@main
    with:
      path: lib/auth
      orig-source: true

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == 'ubuntu/latest'
    uses: unity-desktop/workflows/.github/workflows/release-deb.yaml@main
    with:
      path: lib/auth
      latest: false

  purge:
    needs: build
    if: >-
      !cancelled() && (
        github.event_name == 'push' && needs.build.result == 'success' ||
        github.event.action == 'closed' && !github.event.pull_request.merged)
    uses: unity-desktop/workflows/.github/workflows/purge-deb.yaml@main
    with:
      path: lib/auth
